<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Bao Studios</title>
<style>
  :root { --bg: #f3ecd8; --card: #fbf6e9; --text: #3d3566; --muted: #6b6390; --accent: #4c468b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1c33; --card: #2a2645; --text: #efe9d6; --muted: #bdb5d9; --accent: #b8aef0; }
  }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { color: var(--accent); font-size: 1.9rem; margin: 0 0 4px; }
  h2 { color: var(--accent); margin: 0 0 4px; }
  .byline { color: var(--muted); margin: 0 0 24px; }
  section { background: var(--card); border-radius: 16px; padding: 16px 20px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Happy Bao Studios</h1>
  <p class="byline">Small, cozy games.</p>
  <section>
    <h2>Dustbusted!</h2>
    <p>The dust bunnies have taken over the house, and Grandma isn't having it.
      A cozy pixel-art survival game for iPhone.</p>
    <p><a href="dustbusted/">Support</a> &middot; <a href="dustbusted/privacy/">Privacy policy</a></p>
  </section>
  <p class="byline" style="margin-top:24px">Contact: <a href="mailto:patrikliao@gmail.com">patrikliao@gmail.com</a></p>
</main>
</body>
</html>
